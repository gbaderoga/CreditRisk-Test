[project]
name = "creditrisk-test"
version = "1.0.0"
description = "Qualification d'un système IA d'estimation du risque de défaut de crédit"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["exigence(*ids): exigence(s) vérifiée(s) par le test"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "PL"]
ignore = [
    "PLR2004", "PLR0913", "PLR0915", "PLR0917", "N803", "N806", "PLC0415", "PLW0603",
    "N818",  # exceptions nommées en français (Erreur...), choix assumé
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0912"]
