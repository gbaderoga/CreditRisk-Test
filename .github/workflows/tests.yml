name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      echec_volontaire:
        description: "Activer le test volontairement défaillant (preuve que la CI échoue)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Qualité du code (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.6
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      ECHEC_VOLONTAIRE: ${{ inputs.echec_volontaire && '1' || '0' }}
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Vérifier l'intégrité du modèle versionné
        run: |
          python - <<'PY'
          import json, hashlib
          meta = json.load(open("models/model_v1.json", encoding="utf-8"))
          sha = hashlib.sha256(open("models/model_v1.joblib", "rb").read()).hexdigest()
          assert sha == meta["sha256"], "empreinte du modèle invalide"
          print("modèle", meta["version"], "OK", sha[:12])
          PY
      - name: Pytest + couverture
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml \
                 --cov-fail-under=95 --junitxml=junit.xml \
                 --rapport-exigences=reports/resultats/resultats_tests_ci.json
      - name: Résumé
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, xml.etree.ElementTree as ET
          if os.path.exists("junit.xml"):
              s = ET.parse("junit.xml").getroot()
              s = s if s.tag == "testsuite" else s[0]
              print(f"### Tests : {s.get('tests')} exécutés, {s.get('failures')} échecs, "
                    f"{s.get('errors')} erreurs, {s.get('skipped')} ignorés")
          if os.path.exists("coverage.xml"):
              taux = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
              print(f"### Couverture (lignes) : {taux:.1f} %")
          p = "reports/resultats/resultats_tests_ci.json"
          if os.path.exists(p):
              print("\n| Exigence | Tests | Réussis | Échoués | Ignorés | Anomalies connues |")
              print("|---|---:|---:|---:|---:|---:|")
              for ex, v in json.load(open(p, encoding="utf-8"))["par_exigence"].items():
                  print(f"| {ex} | {v['tests']} | {v['reussi']} | {v['echoue']} | "
                        f"{v['ignore']} | {v['echec_attendu']} |")
          PY
      - name: Archiver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-python-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
            reports/resultats/resultats_tests_ci.json
